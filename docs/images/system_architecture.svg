
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">

  <rect width="1000" height="520" fill="#0D1117"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5F9E9A"/>
    </marker>
  </defs>

  <!-- Frontend -->
  <rect x="50" y="205" width="190" height="100" rx="8"
        fill="#212B36" stroke="#526274" stroke-width="1.5"/>
  <text x="145" y="245" text-anchor="middle"
        fill="#E6EDF3" font-family="Arial" font-size="16">React Frontend</text>
  <text x="145" y="270" text-anchor="middle"
        fill="#AAB7C4" font-family="Arial" font-size="12">User Interface</text>

  <!-- Backend -->
  <rect x="390" y="185" width="230" height="140" rx="8"
        fill="#212B36" stroke="#526274" stroke-width="1.5"/>
  <text x="505" y="220" text-anchor="middle"
        fill="#E6EDF3" font-family="Arial" font-size="16">FastAPI Backend</text>
  <text x="505" y="250" text-anchor="middle"
        fill="#AAB7C4" font-family="Arial" font-size="12">API Routes &amp; SSE</text>
  <text x="505" y="275" text-anchor="middle"
        fill="#AAB7C4" font-family="Arial" font-size="12">Extraction Engine</text>
  <text x="505" y="300" text-anchor="middle"
        fill="#AAB7C4" font-family="Arial" font-size="12">Background Tasks</text>

  <!-- Database -->
  <rect x="770" y="205" width="190" height="100" rx="8"
        fill="#212B36" stroke="#526274" stroke-width="1.5"/>
  <text x="865" y="245" text-anchor="middle"
        fill="#E6EDF3" font-family="Arial" font-size="15">SQLite Database</text>
  <text x="865" y="270" text-anchor="middle"
        fill="#AAB7C4" font-family="Arial" font-size="12">SQLAlchemy ORM</text>

  <!-- Google Scholar -->
  <rect x="230" y="45" width="180" height="75" rx="8"
        fill="#183B3A" stroke="#5F9E9A" stroke-width="1.5"/>
  <text x="320" y="78" text-anchor="middle"
        fill="#E6EDF3" font-family="Arial" font-size="14">Google Scholar</text>
  <text x="320" y="99" text-anchor="middle"
        fill="#B8D0CE" font-family="Arial" font-size="11">Publication Source</text>

  <!-- Scopus -->
  <rect x="460" y="45" width="180" height="75" rx="8"
        fill="#183B3A" stroke="#5F9E9A" stroke-width="1.5"/>
  <text x="550" y="78" text-anchor="middle"
        fill="#E6EDF3" font-family="Arial" font-size="14">Elsevier Scopus API</text>
  <text x="550" y="99" text-anchor="middle"
        fill="#B8D0CE" font-family="Arial" font-size="11">Publication Source</text>

  <!-- Crossref / SCImago -->
  <rect x="690" y="45" width="180" height="75" rx="8"
        fill="#183B3A" stroke="#5F9E9A" stroke-width="1.5"/>
  <text x="780" y="78" text-anchor="middle"
        fill="#E6EDF3" font-family="Arial" font-size="14">Crossref / SCImago</text>
  <text x="780" y="99" text-anchor="middle"
        fill="#B8D0CE" font-family="Arial" font-size="11">External Data Sources</text>

  <!-- Frontend to Backend -->
  <path d="M240 255 H390"
        fill="none" stroke="#5F9E9A" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- Backend to Database -->
  <path d="M620 255 H770"
        fill="none" stroke="#5F9E9A" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- External sources to Backend -->
  <path d="M320 120 V155 H460 V185"
        fill="none" stroke="#5F9E9A" stroke-width="2"
        marker-end="url(#arrow)"/>

  <path d="M550 120 V185"
        fill="none" stroke="#5F9E9A" stroke-width="2"
        marker-end="url(#arrow)"/>

  <path d="M780 120 V155 H550 V185"
        fill="none" stroke="#5F9E9A" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- Architecture Footer -->
  <text x="500" y="405" text-anchor="middle"
        fill="#8FA8C5" font-family="Arial" font-size="13">
    Application Layer · API &amp; Processing Layer · Persistence Layer
  </text>

  <text x="500" y="435" text-anchor="middle"
        fill="#64748B" font-family="Arial" font-size="11">
    External publication sources feed the extraction engine
  </text>

</svg>
