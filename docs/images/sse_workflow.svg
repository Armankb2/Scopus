
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">

  <rect width="900" height="330" fill="#0D1117"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5F9E9A"/>
    </marker>
  </defs>

  <!-- React UI -->
  <rect x="40" y="125" width="175" height="85" rx="8"
        fill="#212B36" stroke="#526274" stroke-width="1.5"/>
  <text x="127" y="160" text-anchor="middle"
        fill="#E6EDF3" font-family="Arial" font-size="15">React UI</text>
  <text x="127" y="184" text-anchor="middle"
        fill="#AAB7C4" font-family="Arial" font-size="12">Fetch Start</text>

  <!-- Backend API -->
  <rect x="290" y="40" width="200" height="85" rx="8"
        fill="#212B36" stroke="#526274" stroke-width="1.5"/>
  <text x="390" y="75" text-anchor="middle"
        fill="#E6EDF3" font-family="Arial" font-size="15">Backend API</text>
  <text x="390" y="99" text-anchor="middle"
        fill="#AAB7C4" font-family="Arial" font-size="12">POST /api/fetch/start</text>

  <!-- Background Worker -->
  <rect x="290" y="205" width="200" height="85" rx="8"
        fill="#212B36" stroke="#526274" stroke-width="1.5"/>
  <text x="390" y="240" text-anchor="middle"
        fill="#E6EDF3" font-family="Arial" font-size="15">Extraction Worker</text>
  <text x="390" y="264" text-anchor="middle"
        fill="#AAB7C4" font-family="Arial" font-size="12">run_extraction_job</text>

  <!-- SSE Stream -->
  <rect x="600" y="125" width="250" height="85" rx="8"
        fill="#183B3A" stroke="#5F9E9A" stroke-width="1.5"/>
  <text x="725" y="158" text-anchor="middle"
        fill="#E6EDF3" font-family="Arial" font-size="15">SSE Progress Stream</text>
  <text x="725" y="181" text-anchor="middle"
        fill="#B8D0CE" font-family="Arial" font-size="12">GET /api/progress/{job_id}</text>
  <text x="725" y="198" text-anchor="middle"
        fill="#B8D0CE" font-family="Arial" font-size="11">EventSourceResponse</text>

  <!-- UI to API -->
  <path d="M215 145 L290 85"
        fill="none" stroke="#5F9E9A" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- API to Worker -->
  <path d="M390 125 L390 205"
        fill="none" stroke="#5F9E9A" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- API to SSE -->
  <path d="M490 82 L600 145"
        fill="none" stroke="#5F9E9A" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- Worker to SSE -->
  <path d="M490 247 L545 247 L545 190 L600 190"
        fill="none" stroke="#5F9E9A" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="450" y="318" text-anchor="middle"
        fill="#8FA8C5" font-family="Arial" font-size="11">
    Asynchronous Extraction · Server-Sent Events · Live Progress Updates
  </text>

</svg>
