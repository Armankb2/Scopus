
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">

  <rect width="1100" height="560" fill="#0D1117"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5F9E9A"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="48" y="48" font-family="Arial" font-size="24" font-weight="700" fill="#E6EDF3">Publication Extraction Workflow</text>
  <text x="48" y="73" font-family="Arial" font-size="11" font-weight="600" letter-spacing="1.5" fill="#8FA8C5">FACULTY SELECTION · DATA RETRIEVAL · UNIFIED PROCESSING</text>
  <line x1="48" y1="94" x2="1052" y2="94" stroke="#303D4B"/>

  <!-- Connectors -->
  <g fill="none" stroke="#5F9E9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M218 166 H270"/>
    <path d="M468 166 H520"/>
    <path d="M718 166 H752 V157 H790"/>
    <path d="M718 166 H752 V285 H790"/>
    <path d="M790 157 H770 V330 H750"/>
    <path d="M790 285 H770 V330 H750"/>
    <path d="M570 416 H480"/>
    <path d="M300 416 H220"/>
  </g>

  <g font-family="Arial">

    <!-- Faculty Selection -->
    <rect x="48" y="124" width="170" height="84" rx="9" fill="#212B36" stroke="#526274" stroke-width="1.5"/>
    <rect x="48" y="124" width="5" height="84" rx="2" fill="#5F9E9A"/>
    <text x="133" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#E6EDF3">Select Faculty</text>
    <text x="133" y="182" text-anchor="middle" font-size="11" fill="#AAB7C4">Choose academic profile</text>

    <!-- Extraction Request -->
    <rect x="270" y="124" width="198" height="84" rx="9" fill="#212B36" stroke="#526274" stroke-width="1.5"/>
    <text x="369" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#E6EDF3">Extraction Request</text>
    <text x="369" y="181" text-anchor="middle" font-size="11" fill="#AAB7C4">POST /api/fetch/start</text>

    <!-- Job Registration -->
    <rect x="520" y="124" width="198" height="84" rx="9" fill="#212B36" stroke="#526274" stroke-width="1.5"/>
    <text x="619" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#E6EDF3">Register Job</text>
    <text x="619" y="181" text-anchor="middle" font-size="11" fill="#AAB7C4">Active check · Lock</text>

    <!-- Publication Sources -->
    <text x="790" y="111" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8FA8C5">PUBLICATION SOURCES</text>

    <rect x="790" y="122" width="260" height="70" rx="9" fill="#183B3A" stroke="#5F9E9A" stroke-width="1.5"/>
    <text x="920" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#E6EDF3">Google Scholar</text>
    <text x="920" y="173" text-anchor="middle" font-size="11" fill="#B8D0CE">Scholar publication retrieval</text>

    <rect x="790" y="250" width="260" height="70" rx="9" fill="#183B3A" stroke="#5F9E9A" stroke-width="1.5"/>
    <text x="920" y="279" text-anchor="middle" font-size="14" font-weight="700" fill="#E6EDF3">Elsevier Scopus API</text>
    <text x="920" y="301" text-anchor="middle" font-size="11" fill="#B8D0CE">Scopus publication retrieval</text>

    <!-- Background Job -->
    <rect x="520" y="270" width="198" height="84" rx="9" fill="#212B36" stroke="#526274" stroke-width="1.5"/>
    <text x="619" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#E6EDF3">Background Job</text>
    <text x="619" y="327" text-anchor="middle" font-size="11" fill="#AAB7C4">Semaphore · Extraction engine</text>

    <!-- Unified Processing -->
    <rect x="570" y="374" width="180" height="84" rx="9" fill="#212B36" stroke="#526274" stroke-width="1.5"/>
    <rect x="570" y="374" width="5" height="84" rx="2" fill="#5F9E9A"/>
    <text x="660" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#E6EDF3">Unified Processing</text>
    <text x="660" y="431" text-anchor="middle" font-size="11" fill="#AAB7C4">build_unified_rows</text>

    <!-- Save Outputs -->
    <rect x="300" y="374" width="180" height="84" rx="9" fill="#212B36" stroke="#526274" stroke-width="1.5"/>
    <rect x="300" y="374" width="5" height="84" rx="2" fill="#5F9E9A"/>
    <text x="390" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#E6EDF3">Save Outputs</text>
    <text x="390" y="431" text-anchor="middle" font-size="11" fill="#AAB7C4">engine.save_outputs</text>

    <!-- Progress -->
    <rect x="48" y="374" width="172" height="84" rx="9" fill="#212B36" stroke="#526274" stroke-width="1.5"/>
    <rect x="48" y="374" width="5" height="84" rx="2" fill="#5F9E9A"/>
    <text x="134" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#E6EDF3">Update Progress</text>
    <text x="134" y="431" text-anchor="middle" font-size="11" fill="#AAB7C4">Completion status</text>

  </g>

  <!-- Footer -->
  <line x1="48" y1="490" x2="1052" y2="490" stroke="#303D4B"/>

  <g font-family="Arial" font-size="11" fill="#AAB7C4">
    <circle cx="58" cy="520" r="5" fill="#526274"/>
    <text x="72" y="524">Application processing</text>

    <circle cx="235" cy="520" r="5" fill="#5F9E9A"/>
    <text x="249" y="524">External data sources</text>

    <circle cx="408" cy="520" r="5" fill="#8FA8C5"/>
    <text x="422" y="524">Output and completion</text>

    <text x="1052" y="524" text-anchor="end" font-size="10" font-weight="700" letter-spacing="1" fill="#8FA8C5">SCOPUS · DATA PIPELINE</text>
  </g>

</svg>
