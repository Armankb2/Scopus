
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">

  <rect width="900" height="360" fill="#0D1117"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5F9E9A"/>
    </marker>
  </defs>

  <!-- React UI -->
  <rect x="40" y="140" width="175" height="85" rx="8"
        fill="#212B36" stroke="#526274" stroke-width="1.5"/>
  <text x="127" y="174" text-anchor="middle"
        fill="#E6EDF3" font-family="Arial" font-size="15">React UI</text>
  <text x="127" y="198" text-anchor="middle"
        fill="#AAB7C4" font-family="Arial" font-size="11">POST /api/fetch/start</text>

  <!-- Backend API -->
  <rect x="290" y="45" width="200" height="85" rx="8"
        fill="#212B36" stroke="#526274" stroke-width="1.5"/>
  <text x="390" y="79" text-anchor="middle"
        fill="#E6EDF3" font-family="Arial" font-size="15">Backend API</text>
  <text x="390" y="103" text-anchor="middle"
        fill="#AAB7C4" font-family="Arial" font-size="11">Register Job &amp; Queue</text>

  <!-- Extraction Worker -->
  <rect x="290" y="235" width="200" height="85" rx="8"
        fill="#212B36" stroke="#526274" stroke-width="1.5"/>
  <text x="390" y="269" text-anchor="middle"
        fill="#E6EDF3" font-family="Arial" font-size="15">Extraction Worker</text>
  <text x="390" y="293" text-anchor="middle"
        fill="#AAB7C4" font-family="Arial" font-size="11">run_extraction_job</text>

  <!-- SSE Endpoint -->
  <rect x="600" y="140" width="260" height="85" rx="8"
        fill="#183B3A" stroke="#5F9E9A" stroke-width="1.5"/>
  <text x="730" y="174" text-anchor="middle"
        fill="#E6EDF3" font-family="Arial" font-size="15">SSE Progress Endpoint</text>
  <text x="730" y="198" text-anchor="middle"
        fill="#B8D0CE" font-family="Arial" font-size="11">GET /api/progress/{job_id}</text>
  <text x="730" y="215" text-anchor="middle"
        fill="#B8D0CE" font-family="Arial" font-size="10">EventSourceResponse</text>

  <!-- UI to API -->
  <path d="M215 155 L290 95"
        fill="none" stroke="#5F9E9A" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- UI to SSE subscription -->
  <path d="M215 210 L250 210 L250 182 L600 182"
        fill="none" stroke="#5F9E9A" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- API to Worker -->
  <path d="M390 130 L390 235"
        fill="none" stroke="#5F9E9A" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- Worker progress to SSE -->
  <path d="M490 277 L545 277 L545 205 L600 205"
        fill="none" stroke="#5F9E9A" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="450" y="345" text-anchor="middle"
        fill="#8FA8C5" font-family="Arial" font-size="11">
    Job Registration · Background Execution · Server-Sent Events · Live Progress
  </text>

</svg>
