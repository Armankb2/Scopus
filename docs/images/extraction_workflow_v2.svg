
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <rect width="1000" height="520" fill="#0D1117"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#6B8FBF"/>
    </marker>
  </defs>

  <!-- Request -->
  <rect x="40" y="55" width="200" height="75" rx="8" fill="#212B36" stroke="#526274"/>
  <text x="140" y="84" text-anchor="middle" fill="#E6EDF3" font-family="Arial" font-size="14">Faculty Selection</text>
  <text x="140" y="106" text-anchor="middle" fill="#AAB7C4" font-family="Arial" font-size="11">POST /api/fetch/start</text>

  <!-- Job Registration -->
  <rect x="300" y="55" width="200" height="75" rx="8" fill="#212B36" stroke="#526274"/>
  <text x="400" y="84" text-anchor="middle" fill="#E6EDF3" font-family="Arial" font-size="14">Register Job</text>
  <text x="400" y="106" text-anchor="middle" fill="#AAB7C4" font-family="Arial" font-size="11">Cache Check</text>

  <!-- Background Task -->
  <rect x="560" y="55" width="200" height="75" rx="8" fill="#212B36" stroke="#526274"/>
  <text x="660" y="84" text-anchor="middle" fill="#E6EDF3" font-family="Arial" font-size="14">Background Execution</text>
  <text x="660" y="106" text-anchor="middle" fill="#AAB7C4" font-family="Arial" font-size="11">run_extraction_job</text>

  <!-- Google Scholar -->
  <rect x="790" y="175" width="180" height="105" rx="8" fill="#183B3A" stroke="#5F9E9A"/>
  <text x="880" y="204" text-anchor="middle" fill="#E6EDF3" font-family="Arial" font-size="14">Google Scholar</text>
  <text x="880" y="229" text-anchor="middle" fill="#B8D0CE" font-family="Arial" font-size="11">fetch_scholar_author_pubs</text>
  <text x="880" y="251" text-anchor="middle" fill="#B8D0CE" font-family="Arial" font-size="11">Optional / Cache Fallback</text>

  <!-- Scopus -->
  <rect x="790" y="330" width="180" height="95" rx="8" fill="#183B3A" stroke="#5F9E9A"/>
  <text x="880" y="360" text-anchor="middle" fill="#E6EDF3" font-family="Arial" font-size="14">Elsevier Scopus API</text>
  <text x="880" y="386" text-anchor="middle" fill="#B8D0CE" font-family="Arial" font-size="11">fetch_scopus_author_pubs</text>

  <!-- Unified Processing -->
  <rect x="520" y="330" width="220" height="95" rx="8" fill="#212B36" stroke="#526274"/>
  <text x="630" y="369" text-anchor="middle" fill="#E6EDF3" font-family="Arial" font-size="14">Unified Processing</text>
  <text x="630" y="393" text-anchor="middle" fill="#AAB7C4" font-family="Arial" font-size="11">build_unified_rows</text>

  <!-- Output -->
  <rect x="270" y="330" width="200" height="95" rx="8" fill="#212B36" stroke="#526274"/>
  <text x="370" y="369" text-anchor="middle" fill="#E6EDF3" font-family="Arial" font-size="14">Save Outputs</text>
  <text x="370" y="393" text-anchor="middle" fill="#AAB7C4" font-family="Arial" font-size="11">CSV / JSON</text>

  <!-- Progress -->
  <rect x="40" y="330" width="180" height="95" rx="8" fill="#212B36" stroke="#526274"/>
  <text x="130" y="369" text-anchor="middle" fill="#E6EDF3" font-family="Arial" font-size="14">Progress Update</text>
  <text x="130" y="393" text-anchor="middle" fill="#AAB7C4" font-family="Arial" font-size="11">PROGRESS_STORE · 100%</text>

  <!-- Arrows -->
  <path d="M240 93 H300" stroke="#6B8FBF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M500 93 H560" stroke="#6B8FBF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M760 93 H775 V227 H790" stroke="#6B8FBF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M760 93 H775 V377 H790" stroke="#6B8FBF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M790 227 H765 V377 H740" stroke="#6B8FBF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M790 377 H740" stroke="#6B8FBF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M520 377 H470" stroke="#6B8FBF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M270 377 H220" stroke="#6B8FBF" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="500" y="485" text-anchor="middle" fill="#8FA8C5" font-family="Arial" font-size="12">Publication Extraction · Source Retrieval · Data Unification · Export</text>
