<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
<title id="title">Publication Extraction Workflow</title>
<style>
  .bg { fill: #0D1117; }
  .step { fill: #64748B; stroke: #30363D; stroke-width:2; }
  .cond { fill: #5F9E9A; }
  .txt { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #E6EDF3; }
  .arrow { stroke:#6B8FBF; stroke-width:2; marker-end:url(#arrowhead); }
</style>
<rect class="bg" width="900" height="500"/>
<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#6B8FBF"/>
  </marker>
</defs>
<!-- UI triggers -->
<g transform="translate(40,80)">
  <rect class="step" width="180" height="80"/>
  <text x="90" y="45" text-anchor="middle" class="txt">Select Faculty &amp; POST /api/fetch/start</text>
</g>
<!-- Job registration -->
<g transform="translate(260,80)">
  <rect class="step" width="180" height="80"/>
  <text x="90" y="30" text-anchor="middle" class="txt" font-size="11">Register Job &amp;<tspan x="90" dy="1.2em">Cache Check</tspan></text>
</g>
<!-- Background job -->
<g transform="translate(480,80)">
  <rect class="step" width="200" height="80"/>
  <text x="100" y="30" text-anchor="middle" class="txt" font-size="11">run_extraction_job (bg task)</text>
</g>
<!-- External data fetches (inside job) -->
<g transform="translate(720,150)">
  <rect class="cond" width="160" height="120"/>
  <text x="80" y="30" text-anchor="middle" class="txt" font-size="11">Google Scholar</text>
  <text x="80" y="55" text-anchor="middle" class="txt" font-size="11">fetch_scholar_author_pubs</text>
  <text x="80" y="80" text-anchor="middle" class="txt" font-size="11">(optional, fallback to cache)</text>
</g>
<g transform="translate(720,300)">
  <rect class="cond" width="160" height="100"/>
  <text x="80" y="30" text-anchor="middle" class="txt" font-size="11">Elsevier Scopus API</text>
  <text x="80" y="55" text-anchor="middle" class="txt" font-size="11">fetch_scopus_author_pubs</text>
</g>
<!-- Merge & build -->
<g transform="translate(480,260)">
  <rect class="step" width="200" height="80"/>
  <text x="100" y="45" text-anchor="middle" class="txt" font-size="11">build_unified_rows</text>
</g>
<!-- Output files -->
<g transform="translate(260,260)">
  <rect class="step" width="180" height="80"/>
  <text x="90" y="45" text-anchor="middle" class="txt" font-size="11">engine.save_outputs (CSV/JSON)</text>
</g>
<!-- Final progress -->
<g transform="translate(40,260)">
  <rect class="step" width="180" height="80"/>
  <text x="90" y="45" text-anchor="middle" class="txt" font-size="11">Update PROGRESS_STORE (100 %)</text>
</g>
<!-- Arrows -->
<line class="arrow" x1="220" y1="120" x2="260" y2="120"/>
<line class="arrow" x1="440" y1="120" x2="480" y2="120"/>
<line class="arrow" x1="680" y1="120" x2="720" y2="210"/>
<line class="arrow" x1="680" y1="340" x2="720" y2="340"/>
<line class="arrow" x1="720" y1="210" x2="560" y2="300"/>
<line class="arrow" x1="560" y1="300" x2="340" y2="300"/>
<line class="arrow" x1="340" y1="300" x2="120" y2="300"/>
</svg>
